<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신간 도서 추천</title>
</head>
<body>
    <h1>주목할 만한 신간 리스트</h1>
    <hr>
    <ul>
        {% for book in book_list %}
        <li>
            <strong>{{ book.title }}</strong> - {{ book.author }}
        </li>
        {% empty %}
        <li>데이터가 없습니다.</li>
        {% endfor %} 
    </ul>
    <br>
    <a href="{% url 'libraries:index' %}">홈으로 돌아가기</a>
    
</body>
</html>
